<!DOCTYPE html>
<html>
<head>
    <title>Delete Task</title>
</head>
<body>

    <h1>Delete Task</h1>

    <p>Are you sure you want to delete this task?</p>

    <h2>{{ task.title }}</h2>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

    </form>

    <br>

    <a href="{% url 'task_list' %}">
        <button type="button">Cancel</button>
    </a>

</body>
</html>
