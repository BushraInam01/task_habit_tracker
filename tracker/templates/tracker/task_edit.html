<form
    id="task-{{ task.id }}"
    hx-post="{% url 'task_update' task.id %}"
    hx-target="#task-{{ task.id }}"
    hx-swap="outerHTML"
>

    {% csrf_token %}

    <p>
        Title:
        <input
            type="text"
            name="title"
            value="{{ task.title }}"
        >
    </p>

    <p>
        Description:
        <textarea name="description">{{ task.description }}</textarea>
    </p>

    <p>
        Priority:
        <input
            type="text"
            name="priority"
            value="{{ task.priority }}"
        >
    </p>

    <p>
        Due Date:
        <input
            type="date"
            name="due_date"
            value="{{ task.due_date|date:'Y-m-d' }}"
        >
    </p>

    <p>
        Completed:
        <input
            type="checkbox"
            name="completed"
            {% if task.completed %}checked{% endif %}
        >
    </p>

    <button type="submit">
        Save
    </button>

</form>
