<!DOCTYPE html>
<html>
<head>
    <title>Delete Habit</title>
</head>

<body>

    <h1>Delete Habit</h1>

    <p>Are you sure you want to delete this habit?</p>

    <h2>{{ habit.name }}</h2>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">Yes, Delete</button>

    </form>

    <br>

    <a href="{% url 'habit_list' %}">
        <button type="button">Cancel</button>
    </a>

</body>
</html>
