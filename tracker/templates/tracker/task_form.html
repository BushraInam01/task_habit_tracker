<!DOCTYPE html>
<html>
<head>
    <title>
        {% if is_update %}
            Edit Task
        {% else %}
            Create Task
        {% endif %}
    </title>
</head>

<body>

    {% if is_update %}
        <h1>Edit Task</h1>
    {% else %}
        <h1>Create New Task</h1>
    {% endif %}


    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        {% if is_update %}
            <button type="submit">Update Task</button>
        {% else %}
            <button type="submit">Create Task</button>
        {% endif %}

    </form>


    <br>

    <a href="{% url 'task_list' %}">
        Back to Tasks
    </a>

</body>
</html>
